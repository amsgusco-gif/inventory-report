<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inventory Report</title>

  <!-- ไอคอน / ติดตั้งเป็นแอป -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#2A2B36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inventory">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #2A2B36;
      --accent: #A97C65;
      --gold: #C9A063;
      --bg: #F3F0EC;
      --muted: #7C7566;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--navy);
      overflow: hidden;
    }

    /* แถบบนสุดกันชนรอยบาก/แถบสถานะ เวลาเปิดแบบแอปบน iPhone */
    .safe-top { height: env(safe-area-inset-top, 0px); background: var(--navy); }

    #app {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100% - env(safe-area-inset-top, 0px));
      border: 0;
      background: var(--bg);
    }

    /* หน้าจอระหว่างโหลด */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      z-index: 10;
      transition: opacity 0.35s ease;
      padding: 24px;
      text-align: center;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 10px 30px rgba(42,43,54,0.18); }
    #splash h1 { margin: 6px 0 0 0; font-size: 20px; }
    #splash p { margin: 0; font-size: 13.5px; color: var(--muted); }

    .spinner {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(169,124,101,0.25);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      margin-top: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #fallback { display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 8px; }
    #fallback.show { display: flex; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 11px 20px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-ghost { background: transparent; color: var(--accent); padding: 6px 10px; }
  </style>
</head>
<body>
  <div class="safe-top"></div>

  <div id="splash">
    <img src="icon-192.png" alt="">
    <h1>Inventory Report</h1>
    <p>GUSCO &amp; GEM · ระบบบันทึกการใช้และรับ Inventory</p>
    <div class="spinner" id="spinner"></div>
    <div id="fallback">
      <p id="fallbackText">ใช้เวลาโหลดนานกว่าปกติ</p>
      <a class="btn" id="openDirect" href="#" target="_blank" rel="noopener">เปิดในเบราว์เซอร์</a>
      <button class="btn btn-ghost" type="button" onclick="location.reload()">ลองโหลดใหม่</button>
    </div>
  </div>

  <iframe id="app" title="Inventory Report" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>

  <script>
    // ======================================================================
    //  ตั้งค่า: วางลิงก์ Web app ของ Apps Script (ลงท้ายด้วย /exec) ระหว่างเครื่องหมาย ' '
    //  หาได้จาก Apps Script > Deploy > Manage deployments > คัดลอก "Web app URL"
    // ======================================================================
    var APP_URL = 'https://script.google.com/macros/s/AKfycbz-CXfNZ9sl8Kh063Es8mAEidxsMRG4CR_1EOfUIe8fGNR9u-fOD6JAT5rUfh_tRoFb/exec';

    (function () {
      var frame = document.getElementById('app');
      var splash = document.getElementById('splash');
      var fallback = document.getElementById('fallback');
      var spinner = document.getElementById('spinner');
      var openDirect = document.getElementById('openDirect');

      function showFallback(message) {
        spinner.style.display = 'none';
        document.getElementById('fallbackText').textContent = message;
        fallback.classList.add('show');
      }

      if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
        showFallback('ยังไม่ได้ตั้งค่าลิงก์ Web app ในไฟล์ index.html (บรรทัด APP_URL)');
        openDirect.style.display = 'none';
        return;
      }

      openDirect.href = APP_URL;
      frame.src = APP_URL;

      frame.addEventListener('load', function () {
        splash.classList.add('hide');
      });

      // ถ้าเน็ตช้าหรือเปิดในกรอบไม่ได้ ให้มีปุ่มเปิดในเบราว์เซอร์
      setTimeout(function () {
        if (!splash.classList.contains('hide')) {
          showFallback('ใช้เวลาโหลดนานกว่าปกติ ตรวจสอบอินเทอร์เน็ต หรือเปิดในเบราว์เซอร์แทน');
        }
      }, 20000);
    })();

    // ให้ติดตั้งเป็นแอปได้ (ไฟล์ sw.js เก็บเฉพาะหน้าตัวเปิดแอปและไอคอน ไม่เก็บข้อมูลของระบบ)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* ไม่เป็นไร แอปยังเปิดได้ */ });
      });
    }
  </script>
</body>
</html>
